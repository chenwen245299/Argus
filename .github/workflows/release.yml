name: Release App
run-name: Release ${{ github.event.inputs.tag || github.ref_name }}

# Keep the commit message short. Put the full Markdown notes in a separate file:
#   git tag -a vX.Y.Z --cleanup=verbatim -F <release-notes-file>
#   git push origin vX.Y.Z

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已推送的注释标签（如 v1.2.0），更新日志取自标签正文'
        required: true
        type: string

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      release_body: ${{ steps.release-notes.outputs.notes }}
      tag_name: ${{ steps.release-notes.outputs.tag }}
      version: ${{ steps.release-notes.outputs.version }}
      commit_sha: ${{ steps.release-notes.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read annotated tag and release notes
        id: release-notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { readReleaseTag } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release-notes.mjs`).href);
            const release = readReleaseTag(process.env.RELEASE_TAG);
            for (const [key, value] of Object.entries(release)) core.setOutput(key, value);

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.release-notes.outputs.notes }}
          TAG_NAME: ${{ steps.release-notes.outputs.tag }}
          COMMIT_SHA: ${{ steps.release-notes.outputs.sha }}
          PRERELEASE: ${{ steps.release-notes.outputs.prerelease }}
        with:
          script: |
            const tagName = process.env.TAG_NAME;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            const existing = releases.find(release => release.tag_name === tagName);
            if (existing && !existing.draft) throw new Error(`${tagName} is already published. Use a new version tag.`);
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: tagName,
              body: process.env.RELEASE_BODY,
              draft: true,
              prerelease: process.env.PRERELEASE === 'true',
              target_commitish: process.env.COMMIT_SHA,
            };
            const { data } = existing
              ? await github.rest.repos.updateRelease({ ...params, release_id: existing.id })
              : await github.rest.repos.createRelease(params);
            return data.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      # Harden cargo's crates.io downloads against flaky CI networks. The
      # "Recv failure: Connection was reset" / "curl [56]" errors on the
      # Windows runner come from HTTP/2 multiplexing dropping mid-download;
      # forcing HTTP/1 plus generous retries makes the fetch resilient.
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HTTP_CHECK_REVOKE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Keep the cache even when a later build step fails, so a transient
          # network error doesn't force a full re-download on the next run.
          cache-on-failure: true

      - name: Sync version and enable bundle
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          tmp=$(mktemp)
          jq --arg v "$VERSION" '.version = $v | .bundle.active = true | .bundle.createUpdaterArtifacts = true' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Ensure icon.ico exists (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            Write-Host "icon.ico missing, generating from icon.png..."
            magick "src-tauri/icons/icon.png" -define icon:auto-resize="256,128,64,48,32,16" "src-tauri/icons/icon.ico"
          } else {
            Write-Host "icon.ico OK"
          }

      # `npm ci`, not `npm install`: the lock file is the whole point of a
      # release build. `npm install` re-resolves every `^` range against the
      # registry, so the Windows job shipped different dependency versions than
      # the macOS and Linux jobs from the same tag — and eventually broke
      # outright, when a freshly-resolved `@tauri-apps/plugin-updater` 2.11.0
      # stopped matching the `tauri-plugin-updater` 2.10.1 that Cargo.lock pins
      # (Tauri refuses to build when an npm package and its Rust crate differ in
      # major/minor).
      - name: Install frontend dependencies
        shell: bash
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseBody: ${{ needs.create-release.outputs.release_body }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseDraft: true

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri]
    steps:
      - name: publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            })
