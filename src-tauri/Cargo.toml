[package]
name = "argus"
version = "0.1.0"
description = "Argus — local-first literature management"
authors = []
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "Argus"
path = "src/main.rs"

[lib]
name = "argus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream", "query"] }
futures = "0.3"
aes-gcm = "0.10"
rand = "0.8"
regex = "1"
lopdf = "0.34"
pdf-extract = "0.7"
# In-process PDF page rasterisation (view_paper_page). Binds to a bundled PDFium
# dynamic library at runtime, so users need no poppler/pdftoppm install. See
# render.rs and scripts/fetch-pdfium.mjs.
pdfium-render = { version = "0.8", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
encoding_rs = "0.8"
mobi = "0.8"
notify = "8.2.0"
# MCP server exposed to external agents (Claude Code / Claude Desktop). Runs as
# a stdio subprocess the client launches — see src/mcp/. `schemars` and the
# transports are not in rmcp's default feature set.
rmcp = { version = "3", features = ["server", "client", "macros", "schemars", "transport-io", "transport-async-rw", "transport-child-process"] }
schemars = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFData", "CFError", "CFString", "CFURL"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Smaller, faster release binary: thin LTO + single codegen unit let LLVM
# optimize across crates; strip removes debug symbols (faster cold start).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

